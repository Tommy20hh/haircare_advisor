<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair &amp; Scalp Care Advisor</title>
<meta name="description" content="Educational photo check for hair and scalp: plain-language answers with a clear note on how far to trust them.">
<meta name="theme-color" content="#F7F4ED">
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/ibm-plex-sans-thai-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="home">
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<div class="shell">
<header class="topbar" id="top">
  <a class="brand" href="index.html"><span class="brandmark" aria-hidden="true">h</span><span class="t" data-i18n="app_title">Hair &amp; Scalp Care Advisor</span></a>
  <nav class="nav" aria-label="Pages">
    <a href="index.html" aria-current="page" data-i18n="nav_check">Check photos</a>
    <a href="details.html" data-i18n="nav_performance">Model performance</a>
    <a href="monitoring.html" data-i18n="nav_monitoring">Service monitoring</a>
  </nav>
  <div class="lang" role="group" aria-label="Language / ภาษา">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="th" aria-pressed="false">ไทย</button>
  </div>
</header>
<noscript><p class="notice notice-bad nojs">This page needs JavaScript to work. / หน้านี้ต้องเปิดใช้ JavaScript จึงจะทำงานได้</p></noscript>
<main id="main">
<section class="hero">
  <div class="homegrid">
    <div class="intro">
      <div class="eyebrow" data-i18n="hero_eyebrow"></div>
      <h1 data-i18n="hero_title">Check your hair and scalp.</h1>
      <p data-i18n="hero_lede"></p>
      <p class="small-note" data-i18n="hero_note"></p>
      <a class="btn btn-primary btn-lg hero-cta" href="#check"><span data-i18n="cta_start">Start the check</span><span aria-hidden="true">→</span></a>
    </div>
    <div class="hero-art">
      <div class="hair-illustration">
    <svg viewBox="0 0 300 390" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path d="M70 390 C42 300 65 190 35 0 L260 0 C225 130 250 250 217 390Z" fill="#24382B"/>
      <path d="M144 390 C132 300 156 210 139 0 L183 0 C165 140 188 275 174 390Z" fill="#D49A7C"/>
      <path d="M151 390 C147 270 164 165 158 0" stroke="#F3C8AC" stroke-width="3" fill="none"/>
      <g stroke="#A9B79D" stroke-width="1.4" fill="none" opacity=".8">
       <path d="M73 390 C20 290 83 190 46 20"/><path d="M88 390 C37 278 96 184 61 0"/><path d="M103 390 C64 286 111 160 87 0"/><path d="M119 390 C84 270 128 160 112 0"/>
       <path d="M200 390 C241 270 207 152 226 0"/><path d="M217 390 C266 270 222 150 245 0"/><path d="M232 390 C282 280 244 160 264 0"/><path d="M55 390 C8 300 56 140 28 75"/>
      </g>
      <g stroke="#18281F" stroke-width="2" fill="none"><path d="M84 390 C39 275 100 175 74 0"/><path d="M111 390 C78 285 130 175 105 0"/><path d="M196 390 C225 285 201 165 216 0"/><path d="M238 390 C277 275 235 155 257 0"/></g>
    </svg>
      </div>
      <div class="art-note" data-i18n="art_note"></div>
    </div>
  </div>
</section>

<section id="check" class="photo-section" aria-labelledby="check-title">
  <div class="section-head"><div><div class="eyebrow" data-i18n="check_eyebrow"></div><h2 id="check-title" data-i18n="check_title"></h2></div><p class="small-note" data-i18n="check_note"></p></div>
  <div id="untested" class="notice" hidden><p data-i18n="untested_banner"></p><a href="details.html#limits" data-i18n="limits_link"></a></div>
  <div id="server-warn" class="notice notice-bad" role="alert" hidden></div>
  <div class="photo-grid">
      <article class="photo-card" id="slot-front" data-slot="front">
        <div class="drop" tabindex="0" role="button" aria-label="" data-i18n-aria="btn_browse">
          <svg class="guide" viewBox="0 0 100 120" aria-hidden="true"><rect x="9" y="8" width="82" height="104" rx="3" fill="#F9F6EF"/><ellipse cx="50" cy="46" rx="20" ry="24" fill="#D9A58A"/><path d="M30 47 Q27 19 50 18 Q74 20 70 47 L64 35 Q51 29 35 37Z" fill="#4B3B32"/><path d="M24 104 Q25 76 50 76 Q76 76 77 104" fill="#E5E9DF" stroke="#53664D" stroke-width="2"/><path d="M36 76 L50 90 L64 76" fill="none" stroke="#53664D" stroke-width="2"/></svg>
          <img class="preview" alt="" hidden>
          <span class="scan" aria-hidden="true"></span>
        </div>
        <div class="card-body">
          <h3 data-i18n="front_title"></h3>
          <p class="why" data-i18n="front_why"></p>
        </div>
        <div class="slot-actions">
          <label class="btn btn-quiet btn-sm"><input type="file" accept="image/jpeg,image/png,image/webp" hidden data-pick="gallery"><span data-i18n="btn_browse"></span></label>
          <label class="btn btn-quiet btn-sm cam-only"><input type="file" accept="image/*" capture="user" hidden data-pick="camera"><span data-i18n="btn_camera"></span></label>
          <button type="button" class="btn-link" data-remove hidden data-i18n="remove"></button>
        </div>
        <p class="slot-msg" data-msg role="alert" hidden></p>
        <div class="pcheck" hidden></div>
        <details class="tips-box"><summary data-i18n="tips_title"></summary>
          <div class="tips">
            <div><h4 data-i18n="good"></h4><ul data-i18n-list="front_do"></ul></div>
            <div><h4 data-i18n="avoid"></h4><ul data-i18n-list="front_dont"></ul></div>
          </div>
        </details>
      </article>
      <article class="photo-card" id="slot-crown" data-slot="crown">
        <div class="drop" tabindex="0" role="button" aria-label="" data-i18n-aria="btn_browse">
          <svg class="guide" viewBox="0 0 100 120" aria-hidden="true"><rect x="8" y="8" width="84" height="104" rx="3" fill="#F9F6EF"/><ellipse cx="50" cy="59" rx="31" ry="37" fill="#C99A7D"/><path d="M19 57 Q13 20 49 19 Q85 20 81 57 L75 76 Q70 39 51 36 Q29 40 25 76Z" fill="#44362F"/><g stroke="#806052" stroke-width="1.4"><path d="M27 38L37 81M37 29L47 89M48 25L56 91M59 28L65 84M70 37L72 73"/></g></svg>
          <img class="preview" alt="" hidden>
          <span class="scan" aria-hidden="true"></span>
        </div>
        <div class="card-body">
          <h3 data-i18n="crown_title"></h3>
          <p class="why" data-i18n="crown_why"></p>
        </div>
        <div class="slot-actions">
          <label class="btn btn-quiet btn-sm"><input type="file" accept="image/jpeg,image/png,image/webp" hidden data-pick="gallery"><span data-i18n="btn_browse"></span></label>
          <label class="btn btn-quiet btn-sm cam-only"><input type="file" accept="image/*" capture="environment" hidden data-pick="camera"><span data-i18n="btn_camera"></span></label>
          <button type="button" class="btn-link" data-remove hidden data-i18n="remove"></button>
        </div>
        <p class="slot-msg" data-msg role="alert" hidden></p>
        <div class="pcheck" hidden></div>
        <details class="tips-box"><summary data-i18n="tips_title"></summary>
          <div class="tips">
            <div><h4 data-i18n="good"></h4><ul data-i18n-list="crown_do"></ul></div>
            <div><h4 data-i18n="avoid"></h4><ul data-i18n-list="crown_dont"></ul></div>
          </div>
        </details>
      </article>
  </div>

  <label class="opt"><input type="checkbox" id="opt-heat"> <span data-i18n="opt_heat"></span></label>
  <div class="runbar">
    <button type="button" id="run" class="btn btn-primary btn-lg" disabled><span id="run-label" data-i18n="btn_check">Check my photos</span><span aria-hidden="true">→</span></button>
    <p id="run-hint" class="muted" role="status" data-i18n="empty_hint"></p>
  </div>
  <p class="small-note privacy-note" data-i18n="photo_privacy"></p>

  <div id="error" class="notice notice-bad" role="alert" hidden><p id="error-text"></p><button type="button" class="btn btn-quiet btn-sm" id="retry" data-i18n="btn_retry" hidden></button></div>

  <details class="bad">
    <summary data-i18n="bad_title">Photos the AI cannot judge</summary>
    <div class="bad-row">
      <figure><img src="assets/bad-far.svg" alt="" width="240" height="300"><figcaption data-i18n="bad_far"></figcaption></figure>
      <figure><img src="assets/bad-hat.svg" alt="" width="240" height="300"><figcaption data-i18n="bad_hat"></figcaption></figure>
      <figure><img src="assets/bad-blur.svg" alt="" width="240" height="300"><figcaption data-i18n="bad_blur"></figcaption></figure>
    </div>
  </details>

  <section id="results" class="results" aria-live="polite" tabindex="-1" hidden></section>
</section>

<section id="how" class="band">
  <div class="eyebrow" data-i18n="how_eyebrow"></div>
  <h2 data-i18n="how_title"></h2>
  <p class="sec-lead" data-i18n="how_lead_simple"></p>
  <ol class="process-grid process-3">
    <li class="process-step"><h3 data-i18n="hs1_t"></h3><p data-i18n="hs1_d"></p></li>
    <li class="process-step"><h3 data-i18n="hs2_t"></h3><p data-i18n="hs2_d"></p></li>
    <li class="process-step"><h3 data-i18n="hs3_t"></h3><p data-i18n="hs3_d"></p></li>
  </ol>
  <p class="small-note" data-i18n="privacy"></p>
  <div class="details-band">
    <div><strong data-i18n="more_t"></strong><p data-i18n="more_d"></p></div>
    <div class="band-links"><a class="btn btn-quiet" href="details.html" data-i18n="nav_performance"></a></div>
  </div>
</section>

</main>
<footer class="foot">
  <p data-i18n="foot"></p>
  <p><span id="ver"></span> · <a href="docs" data-i18n="footer_api" id="api-link">API documentation</a></p>
</footer>
</div>
<script src="js/app.js"></script>
</body>
</html>
